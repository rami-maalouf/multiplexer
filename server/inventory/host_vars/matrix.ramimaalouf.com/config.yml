# the settings of the matrix server, for the playbook at the commit in server/setup.sh.
# no secrets here: they are in vars.yml next to this file (gitignored, written by
# server/setup.sh from the keychain). the playbook's examples/vars.yml is the model.
---
# breaking changes of the playbook reviewed up to this version (see its CHANGELOG.md).
matrix_playbook_migration_validated_version: v2026.05.18.0

# user ids are @name:ramimaalouf.com. the server runs at matrix.ramimaalouf.com, and
# ramimaalouf.com delegates to it with /.well-known/matrix/{server,client}, served by
# the website (repo ~/Documents/code/web/portfolio, folder public/.well-known/matrix).
# this can never change after the first install.
matrix_domain: ramimaalouf.com

matrix_homeserver_implementation: synapse

# traefik answers on 80, 443 and 8448 and gets let's encrypt certificates.
# let's encrypt needs no e-mail address, so traefik_config_certificatesResolvers_acme_email stays empty.
matrix_playbook_reverse_proxy_type: playbook-managed-traefik

# flowback (rami-maalouf/flowback) shares this traefik. its web service listens on
# 127.0.0.1:8893, and a systemd socket bridges it to the docker gateway at 172.26.0.1:8894.
# a playbook run rewrites /matrix/traefik/config/provider.yml, so the route must live here:
# hand edits to that file are lost (2026-11-03 run, site 404 until 2026-11-07).
# source of truth: deploy/bridge/traefik-provider.yml in the flowback repo.
traefik_provider_configuration_extension_yaml: |
  http:
    routers:
      flowback:
        rule: Host(`flowback.orbitlabs.studio`)
        entryPoints:
          - web-secure
        service: flowback
        tls:
          certResolver: default
    services:
      flowback:
        loadBalancer:
          servers:
            - url: http://172.26.0.1:8894

# as the playbook's example recommends. the server has no public ipv6 address yet,
# so there is no AAAA record.
devture_systemd_docker_base_ipv6_enabled: true

# no web client: element x and our app are the clients.
matrix_client_element_enabled: false

# the playbook puts ketesa's (an admin web ui) settings in /.well-known/matrix/client even
# when ketesa is off. we use no ketesa, so the file stays as on the website: m.homeserver only.
matrix_static_files_file_matrix_client_property_cc_etke_ketesa_enabled: false

# ramimaalouf.com answers 301 to www.ramimaalouf.com (vercel). the playbook's check of
# /.well-known/matrix/client does not follow redirects by default, but matrix-rust-sdk
# (element x, our app) and synapse do, so the check follows them too.
matrix_static_files_self_check_well_known_matrix_client_follow_redirects: safe

# the whatsapp bridge (t0.6). rami links his account by sending `login qr` to
# @whatsappbot:ramimaalouf.com and scanning the code in whatsapp > linked devices.
# the image is prebuilt for arm64. bridged rooms are not end-to-end encrypted (the
# playbook's default, matrix_bridges_encryption_enabled: false): the bridge reads every
# message anyway, and plain rooms keep push notifications (phase 3) simple.
matrix_bridge_mautrix_whatsapp_enabled: true

# double puppeting: what rami sends from whatsapp on his phone shows in matrix as sent by
# the connected matrix user, not by a stand-in user of the bridge.
matrix_appservice_double_puppet_enabled: true

# the instagram bridge (mautrix-meta's instagram bridge). a user connects by sending
# `login instagram` (cookies from a browser) or `login android` (user name and password)
# to @instagrambot:ramimaalouf.com. the image is prebuilt for arm64. instagram dms have
# no end-to-end encryption since 2026-05-08, and the bridged rooms stay unencrypted, as
# for whatsapp. the bridge's api: https://matrix.ramimaalouf.com/bridges/meta-instagram.
matrix_bridge_mautrix_meta_instagram_enabled: true

# our copy of the instagram bridge (rami's ok, 2026-11-14): upstream mautrix/meta main
# (4a7ebd9, 2026-10-30) plus one commit that publishes the usernames the bridge stored as
# `instagram:<username>` identifiers, so the app's member page can link to the profile
# (rami-maalouf/meta, branch ig-identifiers-deploy; offered upstream on branch
# ig-publish-stored-usernames). built on the server from upstream's Dockerfile.ig. once
# upstream has it, go back to its prebuilt image: delete the two self-build lines and set
# the version to that commit.
matrix_bridge_mautrix_meta_instagram_container_image_self_build: true
matrix_bridge_mautrix_meta_instagram_container_image_self_build_repo: "https://github.com/rami-maalouf/meta.git"
matrix_bridge_mautrix_meta_instagram_version: "1a9cb2f2aa50222faac16d2d8c8310877b85b95f"

# the linkedin bridge (mautrix-linkedin). a user connects by sending `login password`
# (email or phone, password, then a code or an app approval) or `login cookies` (a cURL
# from chrome) to @linkedinbot:ramimaalouf.com. bridged rooms are not end-to-end
# encrypted, as for whatsapp.
matrix_bridge_mautrix_linkedin_enabled: true

# upstream mautrix/linkedin main (6cc6a89, 2026-11-02), not a release: the password login
# (158ab42) and its 2fa (#72) came after the last release (v0.2609.0, 2026-09-16). the
# image is prebuilt for arm64 (dock.mau.dev/mautrix/linkedin:<commit>-arm64). go back to
# the playbook's release when one has the password login, by deleting this line.
matrix_bridge_mautrix_linkedin_version: "6cc6a8981941b0ac1d50e4c65cfb210668f8fe7e-arm64"

# a small daily backup of the databases (synapse and the bridges), on the server itself, in
# /matrix/postgres-backup. it keeps 7 daily dumps and 2 weekly ones, no monthly: the weekly
# file is a hard link to a daily one, so it takes space only after that daily one is gone.
# it protects against a broken database or a mistake, not against losing the server, and it
# does not hold media (photos). a dump also runs when the container starts (after an install
# or a reboot); it replaces that day's file, so it does not add copies.
postgres_backup_enabled: true
postgres_backup_keep_days: 7
postgres_backup_keep_weeks: 2
postgres_backup_keep_months: 0
postgres_backup_environment_variables_additional_variables: |
  BACKUP_ON_START=TRUE

# delayed events (msc4140), for the app's send later (b13): a message waits on this server
# and goes at its time with the phone off. rami chose a 1-year maximum (2026-11-03). a waiting
# message is one database row; synapse keeps one timer for the next one due, so a longer
# maximum adds no load. clients are rate limited by rc_message (create) and the playbook's
# rc_delayed_event_mgmt (restart, cancel, list).
matrix_synapse_delayed_events_enabled: true
matrix_synapse_max_event_delay_duration: 365d

# b2: no network suffix in names ("Alex" instead of "Alex (WA)"). the app shows each chat's
# network as a logo on its picture (b1), so the bridges' " (WA)", " (IG)" and " (LinkedIn)"
# only repeat it. the fields are the playbook's defaults at the pinned commit, without the
# suffix. names change on the bridge's next update of each contact, not at once: see
# tasks/todo.md, b2. rami's ok: 2026-11-03.
matrix_bridge_mautrix_whatsapp_network_displayname_template: '{% raw %}{{or .BusinessName .PushName .Phone}}{% endraw %}'
matrix_bridge_mautrix_meta_instagram_bridge_displayname_suffix: ''
matrix_bridge_mautrix_linkedin_network_displayname_template: "{% raw %}{{ with .Organization }}{{ . }}{{ else }}{{ .FirstName }} {{ .LastName }}{{ end }}{% endraw %}"

# a member's page in the app has "Open in <network>": the bridges publish each person's
# network identifiers (`com.beeper.bridge.identifiers`, an instagram username, a whatsapp
# phone, a linkedin id) in their matrix profile. off by default, because the bridge writes one
# more profile field per person. a person gets it at the bridge's next update of their info.
# rami's ok, for all bridges: 2026-11-14. whatsapp and linkedin also keep `tel:` identifiers
# (phone_numbers_in_profile), so a whatsapp person with a private `lid-` id still gets a wa.me
# link; this puts contacts' phone numbers in their profiles on this server. rami's ok: 2026-11-14.
matrix_bridge_mautrix_whatsapp_configuration_extension_yaml: |
  matrix:
    ghost_extra_profile_info: true
  bridge:
    phone_numbers_in_profile: true
matrix_bridge_mautrix_meta_instagram_configuration_extension_yaml: |
  matrix:
    ghost_extra_profile_info: true
matrix_bridge_mautrix_linkedin_configuration_extension_yaml: |
  matrix:
    ghost_extra_profile_info: true
  bridge:
    phone_numbers_in_profile: true

# p3.3: sygnal, the push gateway. synapse sends a push for the iphone to sygnal, and sygnal
# sends it to apple (apns) with rami's apns key. it answers at sygnal.ramimaalouf.com (the
# playbook's default host name, no path prefix), so it needs cloudflare's
# `CNAME sygnal -> matrix.ramimaalouf.com` (dns only) before the first install (p3.0).
# the development build registers its pusher with the `.dev` app id (apple's sandbox).
# separate topic-specific keys keep development and production credentials independent.
# it is in the mac's keychain (service multiplexer-apns,
# accounts `key` and `key-id`); server/setup.sh copies it into the gitignored vars.yml, and
# the aux role writes it to the server, readable only by the matrix user.
matrix_sygnal_enabled: true
matrix_sygnal_apps:
  com.ramimaalouf.multiplexer.ios:
    type: apns
    keyfile: /data/apns-production-key.p8
    key_id: "{{ multiplexer_apns_production_key_id }}"
    team_id: 3V2UU7RRK9
    topic: com.ramimaalouf.multiplexer
    platform: production
  com.ramimaalouf.multiplexer.ios.dev:
    type: apns
    keyfile: /data/apns-key.p8
    key_id: "{{ multiplexer_apns_key_id }}"
    team_id: 3V2UU7RRK9
    topic: com.ramimaalouf.multiplexer
    platform: sandbox
aux_file_definitions_custom:
  - dest: "{{ matrix_sygnal_data_path }}/apns-production-key.p8"
    content: "{{ multiplexer_apns_production_key_p8_base64 | b64decode }}"
    mode: '0600'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  - dest: "{{ matrix_sygnal_data_path }}/apns-key.p8"
    content: "{{ multiplexer_apns_key_p8_base64 | b64decode }}"
    mode: '0600'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
